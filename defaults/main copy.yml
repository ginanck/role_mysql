#############################################################################################
# extensions and modules
#############################################################################################
# extensions that will be created for each new database (in postgresql_admin_user_name schema)
postgresql_extensions_default:
  - pg_stat_statements
  - pgstattuple
  - pg_freespacemap
  - postgres_fdw
  - pg_buffercache

# automatically generated based on postgresql_extension_* and postgresql_module_*
postgresql_shared_preload_libraries_default: []
#  - pg_stat_statements
#  - powa
#  - pg_qualstats
#  - pg_stat_kcache
#  - pg_wait_sampling
#  - auto_explain
#  - timescaledb

# true/false
postgresql_extension_pg_stat_statements: true
postgresql_extension_powa: false
postgresql_extension_pg_qualstats: true
postgresql_extension_pg_stat_kcache: true
postgresql_extension_pg_wait_sampling: true
postgresql_extension_timescaledb: false

postgresql_module_auto_explain: true

# pg_stat_statements extension
postgresql_pg_stat_statements_max: 5000
postgresql_pg_stat_statements_track: "all"
postgresql_pg_stat_statements_track_utility: "on"
postgresql_pg_stat_statements_save: "on"

# pg_qualstats extension
postgresql_pg_qualstats_enabled: "true"
postgresql_pg_qualstats_max: 1000
postgresql_pg_qualstats_track_pg_catalog: "false"
postgresql_pg_qualstats_resolve_oids: "false"
postgresql_pg_qualstats_track_constants: "true"
postgresql_pg_qualstats_sample_rate: "-1"

# pg_wait_sampling extension
postgresql_pg_wait_sampling_profile_period: 10
postgresql_pg_wait_sampling_profile_pid: "false"
postgresql_pg_wait_sampling_profile_queries: "true"
postgresql_pg_wait_sampling_history_period: '10000'
postgresql_pg_wait_sampling_history_size: '100'

# auto_explain extension
postgresql_auto_explain_log_analyze: 'false'
postgresql_auto_explain_log_buffers: 'false'
postgresql_auto_explain_log_format: 'text'
postgresql_auto_explain_log_min_duration: '-1'
postgresql_auto_explain_log_nested_statements: 'true'
postgresql_auto_explain_log_triggers: 'true'
postgresql_auto_explain_log_verbose: 'false'
postgresql_auto_explain_sample_rate: '0'
postgresql_auto_explain_log_timing: 'on'

#############################################################################################
# postgresql.conf options
#############################################################################################
postgresql_max_connections: Null
postgresql_listen_addresses: "*"
postgresql_port: 5432
postgresql_unix_socket_directories: "/var/run/postgresql, /tmp"

postgresql_tcp_keepalives_idle: 3
postgresql_tcp_keepalives_interval: 10
postgresql_tcp_keepalives_count: 20

# MB
postgresql_shared_buffers: Null
# MB
postgresql_work_mem: Null
postgresql_huge_pages: "try"
postgresql_temp_buffers: "128MB"
# MB
postgresql_autovacuum_work_mem: Null
postgresql_dynamic_shared_memory_type: "posix"
# MB
postgresql_maintenance_work_mem: Null

postgresql_shared_preload_libraries: Null

postgresql_bgwriter_delay: "200ms"
postgresql_bgwriter_lru_maxpages: 1000
postgresql_bgwriter_lru_multiplier: "2.0"

postgresql_wal_level: Null
postgresql_synchronous_commit: "on"
postgresql_wal_writer_delay: "100ms"
# MB
postgresql_max_wal_size: Null
# MB
postgresql_min_wal_size: Null

postgresql_checkpoint_timeout: "5min"
postgresql_checkpoint_completion_target: "0.8"

postgresql_archive_mode: Null
postgresql_archive_command: Null
# min
postgresql_archive_timeout: Null

postgresql_max_wal_senders: Null
postgresql_wal_keep_segments: Null
postgresql_wal_keep_size: Null
postgresql_max_replication_slots: Null
postgresql_hot_standby: Null

postgresql_seq_page_cost: "1"
postgresql_random_page_cost: Null

# MB
postgresql_effective_cache_size: Null

postgresql_log_destination: "stderr"
postgresql_logging_collector: "on"
postgresql_log_directory: "./"
postgresql_log_filename: "serverlog"
postgresql_log_truncate_on_rotation: "off"
postgresql_log_rotation_age: "356d"
postgresql_log_rotation_size: 0

postgresql_log_min_duration_statement: 8000

postgresql_log_line_prefix: "%t %h %q%u@%d [%a][%x][%v] %% "
postgresql_log_lock_waits: "on"
postgresql_log_statement: Null
postgresql_log_timezone: "{{ postgresql_timezone }}"

postgresql_track_counts: "on"
postgresql_track_io_timing: Null
postgresql_track_activity_query_size: 4096

postgresql_autovacuum: "on"
postgresql_log_autovacuum_min_duration: 600000
postgresql_autovacuum_vacuum_threshold: 100
postgresql_autovacuum_analyze_threshold: 50
postgresql_autovacuum_freeze_max_age: 200000000
postgresql_autovacuum_max_workers: Null
postgresql_autovacuum_vacuum_scale_factor: Null
postgresql_autovacuum_analyze_scale_factor: Null
postgresql_autovacuum_vacuum_cost_delay: Null
postgresql_autovacuum_vacuum_cost_limit: Null

postgresql_datestyle: "iso, mdy"
postgresql_timezone: Null

postgresql_lc_messages: "en_US.UTF-8"
postgresql_lc_monetary: "en_US.UTF-8"
postgresql_lc_numeric: "en_US.UTF-8"
postgresql_lc_time: "en_US.UTF-8"

postgresql_default_text_search_config: "pg_catalog.english"

postgresql_max_locks_per_transaction: Null
postgresql_max_pred_locks_per_transaction: Null
