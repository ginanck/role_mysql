# SELECT only
postgresql_monitor_user_name: monitor
postgresql_monitor_user_password: Null
postgresql_monitor_user_role_attr_flags: ['LOGIN','NOSUPERUSER','INHERIT','NOCREATEDB','NOCREATEROLE','NOREPLICATION']
postgresql_monitor_user_comment: "Monitoring user"

