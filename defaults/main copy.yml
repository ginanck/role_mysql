# SUPERUSER
postgresql_admin_user_name: sysaux
postgresql_admin_user_password: Null
postgresql_admin_user_role_attr_flags: ['LOGIN','SUPERUSER','INHERIT','NOCREATEDB','NOCREATEROLE','NOREPLICATION']
