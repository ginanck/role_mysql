# version
postgresql_version: 13
postgresql_version_terse: "{{ postgresql_version | replace('.', '') }}"  # Short version of the postgresql_version, used in some path and filenames
postgresql_encoding: "UTF-8"
postgresql_data_checksums: false
postgresql_pwfile: ""

# repo
postgresql_install_repository: true
# YUM repository locations
postgresql_yum_repository_url: "http://yum.postgresql.org"
postgresql_pgdg_repository_url: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}/pgdg-redhat-repo-latest.noarch.rpm"

postgresql_yum_repository_gpgkey: "{{ postgresql_pgdg_repository_url }}/RPM-GPG-KEY-PGDG-{{ postgresql_version_terse }}"

rpm_repo_keys:
  - https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG
  - https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG-96
  - https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG-11
  - https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG-12
  - https://download.postgresql.org/pub/repos/yum/RPM-GPG-KEY-PGDG-13

# master/slave
postgresql_role: "master"

# master/patroni
postgresql_installation_type: "master"

# prod/dev
postgresql_installation_environment: "dev"

# single host used for db and applications - true
# host used for db only - false
postgresql_application_shared: true

# package state present - false
# package state latest - true
postgresql_package_upgrade: false

# hdd/ssd
postgresql_disk_type: "hdd"

# true/false/any
postgresql_pitr: "false"

# true/false/any
postgresql_physical_replication: "false"

# true/false
postgresql_logical_replication: false

# initdb options
postgresql_initdb:
  encoding: UTF8
  locale: en_US.utf8
  lc_messages: en_US.UTF-8
  lc_monetary: en_US.UTF-8
  data_checksums: true

postgresql_group:
  name: "postgres"
  gid: 555

postgresql_user:
  name: "postgres"
  uid: 555
  group: "{{ postgresql_group.name }}"
  shell: "/bin/bash"
  home: "/opt/postgres"
  create_home: "yes"

#############################################################################################
# directories
#############################################################################################
postgresql_directory_base: "/db"
postgresql_directory_base_backup: "/dbbackup"
postgresql_directory_scripts: "{{ postgresql_user.home }}/scripts"
postgresql_directory_tmp: "{{ postgresql_user.home }}/tmp"
postgresql_directory_pre_delivery: "{{ postgresql_directory_base_backup }}/dumps/pre_delivery"
postgresql_directory_main: "{{ postgresql_directory_base }}/postgres"
postgresql_directory_database: "{{ postgresql_directory_base }}/databases"
postgresql_directory_pgdata: "{{ postgresql_directory_main }}/{{ postgresql_version }}/pgdata"

#############################################################################################
# pg_hba.conf
#############################################################################################
postgresql_hba_local: 
  - { type: local, database: all, user: all, address: "", auth_method: "{{ postgresql_auth_method_local }}", auth_options: "map=barman", description: "Unix domain socket connections" }
postgresql_hba_lo:
  - { type: host,  database: all, user: all, address: "127.0.0.1/32", auth_method: "{{ postgresql_auth_method_hosts }}", description: "IPv4 local connections:" } 
  - { type: host,  database: all, user: all, address: "::1/128",      auth_method: "{{ postgresql_auth_method_hosts }}", description: "IPv6 local connections:" }
postgresql_hba_devex:
  - { type: host, database: all, user: all, address: "89.113.128.0/21",   auth_method: "{{ postgresql_auth_method_hosts }}", description: "Devex Saint Petersburg" }
  - { type: host, database: all, user: all, address: "89.113.131.0/24", auth_method: "{{ postgresql_auth_method_hosts }}" }
  - { type: host, database: all, user: all, address: "87.245.203.125/32", auth_method: "{{ postgresql_auth_method_hosts }}", description: "Devex Rostov-on-Don" }
  - { type: host, database: all, user: all, address: "84.47.149.181/32",  auth_method: "{{ postgresql_auth_method_hosts }}" }
  - { type: host, database: all, user: all, address: "87.245.203.112/28", auth_method: "{{ postgresql_auth_method_hosts }}" }
  - { type: host, database: all, user: all, address: "185.79.217.0/24", auth_method: "{{ postgresql_auth_method_hosts }}", description: "Devex Germany"}
  - { type: host, database: all, user: all, address: "185.79.216.0/24", auth_method: "{{ postgresql_auth_method_hosts }}" }
  - { type: host, database: all, user: all, address: "185.79.218.0/23", auth_method: "{{ postgresql_auth_method_hosts }}" }
  - { type: host, database: all, user: all, address: "31.130.208.0/21", auth_method: "{{ postgresql_auth_method_hosts }}", description: "Devex Europe" }
  - { type: host, database: all, user: all, address: "208.93.100.250/32", auth_method: "{{ postgresql_auth_method_hosts }}", description: "Devex New Jersey" }
postgresql_hba_workstations:
  - { type: host, database: all, user: all, address: "192.168.26.0/24", auth_method: "{{ postgresql_auth_method_hosts }}", description: "Devex Workstations" }
  - { type: host, database: all, user: all, address: "192.168.101.0/24", auth_method: "{{ postgresql_auth_method_hosts }}"}
  - { type: host, database: all, user: all, address: "192.168.126.0/24", auth_method: "{{ postgresql_auth_method_hosts }}"}
  - { type: host, database: all, user: all, address: "192.168.217.0/24", auth_method: "{{ postgresql_auth_method_hosts }}"}
  - { type: host, database: all, user: all, address: "192.168.218.0/24", auth_method: "{{ postgresql_auth_method_hosts }}"}
postgresql_hba_custom: []
#  - { type: host, database: all, user: all, address: "192.168.0.0/16", auth_method: "{{ postgresql_auth_method_hosts }}", description: "Applications" }
postgresql_hba_allow_devex: true
postgresql_hba_allow_workstations: "{% if postgresql_installation_environment == 'dev' %}true{% else %}false{% endif %}"
postgresql_auth_method_local: "peer"
postgresql_auth_method_hosts: "scram-sha-256"

