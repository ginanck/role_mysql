---
# defaults file for role-mysql

mysqld_user: "mysql"
mysqld_datadir: "/var/lib/mysql"
mysqld_socket: "/var/lib/mysql/mysql.sock"

mysqld_log_error: "/var/log/mysqld.log"
mysqld_pidfile: "/var/run/mysqld/mysqld.pid"

mysqld_port: "3306"
mysqld_bind_address: "0.0.0.0"
mysqld_validate_password_policy: "LOW"

mysqld_root_user:
  - name: "root"
    password: "LzdnvxP2UWX6lZLwQ."
    my_cnf_path: /root/.my.cnf
    temp_pass_check_file: /etc/my.cnf.txt

# 'host' should be '%' for allow from every where
# 'host' should be '192.168.179.1' for specific host
# 'host' should be 'localhost' for network
mysqld_db:
  - db:
      database: "wp_test_db"
      users:
      - username: "wp_test_admin"
        password: "y0pohdCdRxRdCZ59T."
        host: 'localhost'
