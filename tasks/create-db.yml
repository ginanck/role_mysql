---

- name: show database list
  shell:
    cmd: mysql -e "show databases;" | grep -iv "-" | xargs
  register: db_result

- name: set_fact database list
  set_fact: 
    db_list: "{{ db_result.stdout.split() }}"

- name: set_fact database list
  set_fact: 
    databases: "{{ db.db }}"

- name: create databases
  shell:
    cmd: mysql -e "CREATE DATABASE {{ item.database }};"
  when:
    - ('{{ item.database }}' not in {{ db_list }})
  with_items:
    - "{{ databases }}"
