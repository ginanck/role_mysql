---
# tasks file for role-mysql

- name: install mysql
  import_tasks: install.yml

- name: configure mysql
  import_tasks: configure.yml

- name: create databases
  include_tasks: create-db.yml
  with_items:
    - "{{ mysqld_db }}"
  loop_control:
    loop_var: db

- name: create users
  include_tasks: create-user.yml
  with_items:
    - "{{ mysqld_db }}"
  loop_control:
    loop_var: db

