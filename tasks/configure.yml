---

- name: start mysql server
  systemd:
    name: mysqld
    daemon_reload: yes
    enabled: yes
    state: started

- name: Check that the somefile.conf exists
  stat:
    path: "{{ item.temp_pass_check_file }}"
  with_items:
     - "{{ mysqld_root_user }}"
  register: stat_result

- name: get temporary password
  shell:
    cmd: grep 'temporary password' /var/log/mysqld.log | sed -e 's#.* \(\)#\1#'
  register: temporary_password
  when:
    - "{{ stat_result.results[0].stat.exists }} is false"

- name: define temporary password for passwordless access for a little while
  copy:
    content: |
      [mysql]
      user='root'
      password='{{ temporary_password.stdout }}'
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0644'
  when:
    - "{{ stat_result.results[0].stat.exists }} is false"

- name: change root password
  become: yes
  become_user: root
  become_flags: '-i'
  shell:
    cmd: mysql -e "ALTER USER '{{ item.name }}'@'localhost' IDENTIFIED BY '{{ item.password }}';" --connect-expired-password
  with_items:
     - "{{ mysqld_root_user }}"
  when:
    - "{{ stat_result.results[0].stat.exists }} is false"

- name: update password for passwordless login
  copy:
    content: |
      [mysql]
      user='root'
      password='{{ item.password }}'
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: '0600'
  with_items:
     - "{{ mysqld_root_user }}"

- name: change password policy level
  become: yes
  become_user: root
  become_flags: '-i'
  shell:
    cmd: mysql -e "SET GLOBAL validate_password_policy=LOW;" --connect-expired-password
  with_items:
     - "{{ mysqld_root_user }}"
  when:
    - "{{ stat_result.results[0].stat.exists }} is false"

- name: mysql temporary password if change control file
  copy:
    content: |
      true
    dest: /etc/my.cnf.txt
    owner: root
    group: root
    mode: '02755'
  when:
    - "{{ stat_result.results[0].stat.exists }} is false"

- name: create my.conf
  template:
    src: my.cnf.j2
    dest: "/etc/my.cnf"
    owner: "root"
    group: "root"
    mode: 0644
  notify:
    - restart mysql

- name: create databases
  include_tasks: create-db.yml
  with_items:
    - "{{ mysqld_db }}"
  loop_control:
    loop_var: db

- name: create users
  include_tasks: create-user.yml
  with_items:
    - "{{ mysqld_db }}"
  loop_control:
    loop_var: db
