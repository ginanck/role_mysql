---

- name: check users
  shell:
    cmd: mysql -e "SELECT user FROM mysql.user;"
  register: user_result

- name: set_fact user list
  set_fact: 
    user_list: "{{ user_result.stdout.split() }}"

- name: set_fact user list
  set_fact: 
    users: "{{ db.db }}"

- name: create users
  shell: |
    mysql -e "CREATE USER '{{ item.username }}'@'{{ item.host }}' IDENTIFIED BY '{{ item.password }}';"
    mysql -e "GRANT ALL PRIVILEGES ON {{ users.database }}.* TO '{{ item.username }}'@'{{ item.host }}' IDENTIFIED BY '{{ item.password }}' WITH GRANT OPTION;"
    mysql -e "FLUSH PRIVILEGES;"
  when:
    - ('{{ item.username }}' not in {{ user_list }})
  with_items:
    - "{{ users.users }}"
